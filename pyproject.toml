[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowlens-process-intelligence"
version = "0.1.0"
description = "Local-first process intelligence and improvement research workbench"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.39,<2.0",
  "pandas>=2.1,<3.0",
  "numpy>=1.26,<3.0",
  "plotly>=5.24,<7.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
